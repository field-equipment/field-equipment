<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>Field Equipment</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",Arial,sans-serif;background:#f0f4f8;min-height:100vh}
.hdr{background:linear-gradient(135deg,#1a5c2a,#2d8a3e);padding:16px 20px;display:flex;align-items:center;justify-content:space-between}
.hdr-l{color:#f0c040;font-size:1.1rem;font-weight:800;letter-spacing:1px}
.hdr-s{color:rgba(255,255,255,.8);font-size:.7rem;margin-top:2px}
.card{background:#fff;margin:16px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.1);overflow:hidden}
.ch{background:linear-gradient(135deg,#1a5c2a,#2d8a3e);padding:20px;display:flex;align-items:center;gap:16px}
.ci{background:rgba(255,255,255,.15);border-radius:12px;width:64px;height:64px;display:flex;align-items:center;justify-content:center;font-size:2.2rem;flex-shrink:0}
.eid{color:#fff;font-size:2rem;font-weight:900;line-height:1}
.emd{color:rgba(255,255,255,.85);font-size:.9rem;margin-top:4px}
.eub{color:#f0c040;font-size:.8rem;margin-top:4px}
.sec{color:#64748b;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:12px 20px 4px;background:#f8fafc}
.dr{display:flex;justify-content:space-between;align-items:center;padding:13px 20px;border-bottom:1px solid #f1f5f9}
.dr:last-child{border-bottom:none}
.lb{color:#64748b;font-size:.8rem;font-weight:600}
.vl{color:#1e293b;font-size:.88rem;font-weight:700;text-align:right}
.big{font-size:1.25rem;color:#1a5c2a}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.bc{padding:16px;display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
.btn{display:flex;align-items:center;gap:14px;padding:18px 20px;border-radius:14px;text-decoration:none;width:100%;text-align:left;border:none;cursor:pointer}
.bh{background:#fff;border:2px solid #e2e8f0;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.bn{background:linear-gradient(135deg,#f0c040,#d4a017)}
.bi{font-size:1.8rem;flex-shrink:0}
.bt{font-size:1rem;font-weight:700;color:#1e293b}
.bn .bt{color:#1a1a00}
.bs{font-size:.75rem;color:#64748b;margin-top:2px}
.bn .bs{color:rgba(0,0,0,.5)}
.ft{text-align:center;padding:16px;color:#94a3b8;font-size:.7rem;border-top:1px solid #f1f5f9}
.chip{display:inline-block;background:rgba(255,255,255,.2);color:#fff;padding:2px 8px;border-radius:10px;font-size:.7rem;margin-top:4px}
.nf{text-align:center;padding:60px 20px;color:#64748b}
.nf h2{color:#1a5c2a;margin-bottom:8px}
</style>
</head>
<body>
<div class="hdr">
  <div><div class="hdr-l">&#9650; SYNGENTA</div>
  <div class="hdr-s">Field Equipment LAS &middot; Gesti&oacute;n de Mantenimiento</div></div>
  <span style="font-size:2rem">&#127806;</span>
</div>
<div id="C"></div>
<script>
var EQ=[{"id": "CO002", "ubic": "MORETTO", "marca": "NEW HOLLAND", "modelo": "CR 5.85", "grupo": "COSECHADORAS", "serie_m": "8066370", "chasis": "JHFY3585AKJF13825", "usuario": "Ariel Gomez", "sector": "TRIALING", "extintor": "2026-10-02", "samaco_ult": "2026-03-06", "samaco_prox": "2027-03-06", "anio": "2020", "estado": "OK", "hs_act": 2100, "cond_hs": "OK", "lat": 0, "lon": 0}];
var SV={"CO002": {"hs": 2100, "dt": "2026-06-03", "ult": 2049, "dult": "2026-05-06", "prx": 2349, "flt": 249, "cond": "OK"}};
var SF="https://app.smartsheet.com/b/form/4b718295a9fe4fa7bb893b3c54ce42ac";
var RU="https://field-equipment.github.io/field-equipment/reporte.html";
var IC={"TRACTOR":"&#128668;","COSECHADORAS":"&#127806;","PULVERIZADOR":"&#128167;","SEMBRADORA":"&#127793;","DRONES":"&#128641;","BALANZA":"&#9878;","VARIOS":"&#128295;","DEFAULT":"&#128295;"};
function gi(g){return IC[g]||IC.DEFAULT;}
function fh(v){return v?Number(v).toLocaleString("es-AR")+" hs":"--";}
function ff(v){if(!v||v.length<10)return "--";return v.substring(8,10)+"/"+v.substring(5,7)+"/"+v.substring(0,4);}
function dc(f){if(!f||f.length<10)return "#94a3b8";var d=new Date(f),n=new Date(),x=(d-n)/86400000;return x<0?"#ef4444":x<60?"#f59e0b":"#22c55e";}

function mkEl(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html)e.innerHTML=html;return e;}
function mkRow(lbl,val){
  var d=mkEl("div","dr");
  var s=mkEl("span","lb"); s.textContent=lbl; d.appendChild(s);
  var v=mkEl("span","vl"); v.innerHTML=val; d.appendChild(v);
  return d;
}
function mkRowH(lbl,val,bg){
  var d=mkRow(lbl,val); d.style.background=bg; return d;
}
function mkDot(fecha){
  var s=mkEl("span","dot"); s.style.background=dc(fecha); return s;
}
function mkSec(txt){var d=mkEl("div","sec");d.textContent=txt;return d;}

function show(eq,sv){
  var wrap=document.getElementById("C");
  var card=mkEl("div","card");

  // Header
  var ch=mkEl("div","ch");
  var ci=mkEl("div","ci"); ci.innerHTML=gi(eq.grupo); ch.appendChild(ci);
  var info=mkEl("div");
  var eid=mkEl("div","eid"); eid.textContent=eq.id; info.appendChild(eid);
  var emd=mkEl("div","emd"); emd.textContent=(eq.marca||"")+(eq.modelo?" - "+eq.modelo:""); info.appendChild(emd);
  var eub=mkEl("div","eub"); eub.innerHTML="&#128205; "+(eq.ubic||"--"); info.appendChild(eub);
  if(eq.anio){var chip=mkEl("span","chip");chip.textContent=eq.anio;info.appendChild(chip);}
  ch.appendChild(info); card.appendChild(ch);

  // Identificacion
  card.appendChild(mkSec("Identificación"));
  if(eq.serie_m) card.appendChild(mkRow("N° Serie Motor",eq.serie_m));
  if(eq.chasis) card.appendChild(mkRow("N° Chasis",eq.chasis));
  if(eq.usuario) card.appendChild(mkRow("Usuario",eq.usuario));
  if(eq.sector) card.appendChild(mkRow("Sector",eq.sector));
  if(eq.grupo) card.appendChild(mkRow("Grupo",eq.grupo));

  // Horas Motor
  if(sv){
    var cc=sv.cond==="REALIZAR SERVICE"?"#ef4444":sv.flt<=50?"#f59e0b":"#22c55e";
    card.appendChild(mkSec("Horas Motor"));
    card.appendChild(mkRowH("Horas Actuales",fh(sv.hs),"#f0fdf4"));
    card.appendChild(mkRow("Ult. Service",(sv.dult?ff(sv.dult):"--")+(sv.ult?" ("+fh(sv.ult)+")":"")));
    var prxEl=mkEl("span"); prxEl.innerHTML=fh(sv.prx)+" &bull; Faltan <b style="color:"+cc+"">"+sv.flt+" hs</b>";
    card.appendChild(mkRow("Prox. Service",prxEl.innerHTML));
    card.appendChild(mkRow("Fecha ult. registro",sv.dt?ff(sv.dt):"--"));
  }

  // Seguridad
  var hE=eq.extintor&&eq.extintor.length>3;
  var hS=(eq.samaco_ult&&eq.samaco_ult.length>3)||(eq.samaco_prox&&eq.samaco_prox.length>3);
  if(hE||hS){
    card.appendChild(mkSec("Seguridad y Certificaciones"));
    if(hE){
      var extRow=mkEl("div","dr");
      var lb=mkEl("span","lb"); lb.textContent="Venc. Extintores"; extRow.appendChild(lb);
      var vl=mkEl("span","vl"); vl.appendChild(mkDot(eq.extintor));
      var ft=document.createTextNode(ff(eq.extintor)); vl.appendChild(ft);
      extRow.appendChild(vl); card.appendChild(extRow);
    }
    if(eq.samaco_ult&&eq.samaco_ult.length>3) card.appendChild(mkRow("Ult. SAMACO",ff(eq.samaco_ult)));
    if(eq.samaco_prox&&eq.samaco_prox.length>3){
      var spRow=mkEl("div","dr");
      var lb2=mkEl("span","lb"); lb2.textContent="Prox. SAMACO"; spRow.appendChild(lb2);
      var vl2=mkEl("span","vl"); vl2.appendChild(mkDot(eq.samaco_prox));
      vl2.appendChild(document.createTextNode(ff(eq.samaco_prox)));
      spRow.appendChild(vl2); card.appendChild(spRow);
    }
  }

  // Botones
  var bc=mkEl("div","bc");
  var a1=mkEl("a","btn bh");
  a1.href=RU+"#equipo="+eq.id;
  a1.setAttribute("data-eq",eq.id);
  a1.onclick=function(){sessionStorage.setItem("eq_filter",eq.id);};
  a1.innerHTML="<span class="bi">&#128203;</span><div><div class="bt">Ver Historial de OTs</div><div class="bs">Reporte filtrado por "+eq.id+"</div></div>";
  bc.appendChild(a1);
  var a2=mkEl("a","btn bn");
  a2.href=SF; a2.target="_blank";
  a2.innerHTML="<span class="bi">&#10133;</span><div><div class="bt">Cargar OT Nueva</div><div class="bs">Registrar mantenimiento o falla</div></div>";
  bc.appendChild(a2);
  card.appendChild(bc);

  // Footer
  var ft2=mkEl("div","ft");
  ft2.innerHTML=eq.id+" &bull; "+(eq.grupo||"")+(eq.modelo?" &bull; "+eq.modelo:"")+"<br>Syngenta Field Equipment LAS";
  card.appendChild(ft2);

  wrap.appendChild(card);
}

(function(){
  var p=new URLSearchParams(window.location.search);
  var id=(p.get("eq")||"").toUpperCase().trim();
  var c=document.getElementById("C");
  if(!id){
    var nf=document.createElement("div"); nf.className="nf";
    nf.innerHTML="<h2>Field Equipment</h2><p>Escane&aacute; el QR del equipo.</p>";
    c.appendChild(nf); return;
  }
  document.title=id+" - Syngenta Field Equipment";
  var eq=(EQ||[]).find(function(e){return e.id===id;});
  if(!eq){
    var nf2=document.createElement("div"); nf2.className="nf";
    nf2.innerHTML="<h2>No encontrado</h2><p>"+id+" no est&aacute; activo.</p>";
    c.appendChild(nf2); return;
  }
  show(eq,(SV||{})[id]||null);
})();
</script>
</body>
</html>
