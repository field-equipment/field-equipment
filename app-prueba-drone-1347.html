<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prueba Drone DR-LV-1347</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    .wrap {
      max-width: 620px;
      margin: 0 auto;
      padding: 20px 14px;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 18px rgba(15, 23, 42, .12);
    }

    .header {
      padding: 22px;
      background: #075b2b;
      color: white;
    }

    .header small {
      opacity: .8;
      font-weight: bold;
      letter-spacing: .5px;
    }

    h1 {
      margin: 8px 0 5px;
      font-size: 26px;
    }

    .model {
      margin: 0;
      font-size: 15px;
      opacity: .9;
    }

    .content { padding: 20px; }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      padding: 13px 0;
      border-bottom: 1px solid #e2e8f0;
    }

    .label {
      color: #64748b;
      font-size: 14px;
      font-weight: bold;
    }

    .value {
      text-align: right;
      font-size: 14px;
      font-weight: bold;
    }

    .section {
      margin: 18px 0 8px;
      color: #64748b;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: .6px;
    }

    .button {
      display: flex;
      align-items: center;
      gap: 13px;
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      text-decoration: none;
      margin-top: 12px;
      transition: transform .15s ease;
    }

    .button:active { transform: scale(.98); }

    .button-icon {
      font-size: 26px;
    }

    .button-title {
      display: block;
      font-size: 16px;
      font-weight: bold;
    }

    .button-subtitle {
      display: block;
      margin-top: 3px;
      font-size: 13px;
    }

    /* Botón verde para el formulario de entrega/recibo */
    .delivery-button {
      background: linear-gradient(135deg, #177245, #0b5130);
      color: white;
    }

    .delivery-button .button-subtitle {
      color: rgba(255,255,255,.82);
    }

    .notice {
      margin-top: 16px;
      color: #64748b;
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>

<body>
  <main class="wrap">
    <section class="card">
      <header class="header">
        <small>DRONES · PRUEBA</small>
        <h1>DR-LV-1347-</h1>
        <p class="model">DJI Mavic 3 Multiespectral</p>
      </header>

      <div class="content">
        <div class="section">Identificación</div>

        <div class="row">
          <span class="label">Ubicación</span>
          <span class="value">MORETTO</span>
        </div>

        <div class="row">
          <span class="label">Sector</span>
          <span class="value">TRIALING</span>
        </div>

        <div class="row">
          <span class="label">Grupo</span>
          <span class="value">DRONES</span>
        </div>

        <a
          class="button delivery-button"
          href="https://app.smartsheet.com/b/form/02a70a914bb94e4a815e376d16703af2"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="button-icon">📋</span>
          <span>
            <span class="button-title">Registro entrega/recibo</span>
            <span class="button-subtitle">Abrir formulario</span>
          </span>
        </a>

        <p class="notice">
          Página de prueba independiente. No modifica la aplicación principal.
        </p>
      </div>
    </section>
  </main>
</body>
</html>
